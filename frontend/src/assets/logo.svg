<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mmi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Radial Glow Highlight -->
    <radialGradient id="mmi-glow" cx="25%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0" />
    </radialGradient>

    <!-- M Waveform Bars Gradient -->
    <linearGradient id="mmi-bars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Primary AI Sparkle Gradient -->
    <linearGradient id="mmi-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Bubble Shadow -->
    <filter id="mmi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="116" fill="url(#mmi-bg)" />
  <!-- Radial Highlight Layer -->
  <rect width="512" height="512" rx="116" fill="url(#mmi-glow)" />
  <!-- Inset Border Stroke -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.2" />

  <!-- Main Speech Bubble Shape -->
  <g filter="url(#mmi-shadow)">
    <path d="M 160 144
             h 176
             a 48 48 0 0 1 48 48
             v 116
             a 48 48 0 0 1 -48 48
             h -112
             l -68 44
             c 10 -18 16 -34 16 -44
             h -12
             a 48 48 0 0 1 -48 -48
             v -116
             a 48 48 0 0 1 48 -48
             z"
          fill="#FFFFFF" />
  </g>

  <!-- 5 Equalizer Bars Forming the Letter 'M' -->
  <g fill="url(#mmi-bars)">
    <rect x="165" y="194" width="22" height="112" rx="11" />
    <rect x="201" y="222" width="22" height="56" rx="11" />
    <rect x="237" y="206" width="22" height="88" rx="11" />
    <rect x="273" y="222" width="22" height="56" rx="11" />
    <rect x="309" y="194" width="22" height="112" rx="11" />
  </g>

  <!-- Primary AI Sparkle (Top-Right) -->
  <path d="M 398 92
           Q 398 128 434 128
           Q 398 128 398 164
           Q 398 128 362 128
           Q 398 128 398 92 Z"
        fill="url(#mmi-sparkle)" />

  <!-- Secondary Accent Sparkle -->
  <path d="M 436 74
           Q 436 88 450 88
           Q 436 88 436 102
           Q 436 88 422 88
           Q 436 88 436 74 Z"
        fill="#38BDF8" opacity="0.95" />
</svg>
