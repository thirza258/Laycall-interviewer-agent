map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens "380" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
    }

    # RFC 9727 API Catalog
    location = /.well-known/api-catalog {
        default_type "application/linkset+json; charset=utf-8";
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Auth.md discovery
    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # RFC 9728 OAuth Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OAuth / OIDC Discovery & Bot Auth
    location ~* ^/\.well-known/(openid-configuration|oauth-authorization-server|agent-card\.json|jwks\.json|http-message-signatures-directory)$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Agent Skills Discovery
    location = /.well-known/agent-skills/index.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SEP-1649 MCP Server Cards
    location ~* ^/\.well-known/mcp/.*\.json$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/mcp.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Skill markdown artifacts
    location /skills/ {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OpenAPI schema & docs proxies
    location = /api/openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    # /app/ is the React app, / is the static landing page. Both are declared
    # explicitly rather than leaning on nginx's directory-index fallback, so
    # the split cannot quietly break on an nginx upgrade.
    location = /app {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        return 301 /app/;
    }

    location /app/ {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Vary "Accept" always;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # Public React SPA routes (Courses catalog, Question bank, HR practice)
    location ~ ^/(courses|questions|hr)(/.*)?$ {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Vary "Accept" always;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # Serve static files
    location / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;

        # The HTML names the fingerprinted bundles below, so it has to be
        # revalidated or a deploy keeps serving the previous build. robots.txt
        # and sitemap.xml are served from here too and want the same freshness.
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints every filename under /assets/, so those bytes never
    # change and can be cached for as long as the browser likes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Allow multipart headers around a 10MB resume. The backend still enforces
    # the 10MB limit on the file itself.
    client_max_body_size 11m;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Question generation runs several LLM calls in one request and can
        # take minutes. The 60s default cut those requests off mid-flight,
        # which surfaced in the UI as a lost connection.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy health check
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml text/markdown application/linkset+json;
    gzip_min_length 256;
}
