server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # /app/ is the React app, / is the static landing page. Both are declared
    # explicitly rather than leaning on nginx's directory-index fallback, so
    # the split cannot quietly break on an nginx upgrade.
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;

        # The HTML names the fingerprinted bundles below, so it has to be
        # revalidated or a deploy keeps serving the previous build. robots.txt
        # and sitemap.xml are served from here too and want the same freshness.
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints every filename under /assets/, so those bytes never
    # change and can be cached for as long as the browser likes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resumes are accepted up to 10MB by the backend; nginx defaults to 1MB.
    client_max_body_size 10m;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Question generation runs several LLM calls in one request and can
        # take minutes. The 60s default cut those requests off mid-flight,
        # which surfaced in the UI as a lost connection.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy health check
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
