services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-interview_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-interview_password}
      POSTGRES_DB: ${DB_NAME:-interview_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-interview_user} -d ${DB_NAME:-interview_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-interview};
      mc anonymous set download local/${MINIO_BUCKET:-interview};
      echo 'MinIO bucket ready';
      "

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DEBUG: ${DEBUG:-False}
      DB_USER: ${DB_USER:-interview_user}
      DB_PASSWORD: ${DB_PASSWORD:-interview_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-interview_db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-90}
      OPENROUTER_CONNECT_TIMEOUT: ${OPENROUTER_CONNECT_TIMEOUT:-10}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-3}
      QUESTION_GENERATION_TIMEOUT: ${QUESTION_GENERATION_TIMEOUT:-240}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-interview}
      MINIO_SECURE: "False"
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
