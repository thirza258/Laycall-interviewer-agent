services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-interview_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-interview_password}
      POSTGRES_DB: ${DB_NAME:-interview_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-interview_user} -d ${DB_NAME:-interview_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Reuse the MinIO that the decalove project already runs instead of starting
  # a second server. The backend joins decalove's compose network and reaches
  # it by service name; this one-shot job only creates the interviewer bucket
  # and marks it publicly readable, which the old local minio-init did.
  minio-init:
    image: minio/mc:latest
    networks:
      - decalove
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-decalove-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-interview}
    entrypoint: >
      /bin/sh -c "
      mc alias set decalove \"http://$${MINIO_ENDPOINT}\" \"$${MINIO_ACCESS_KEY}\" \"$${MINIO_SECRET_KEY}\";
      mc mb --ignore-existing decalove/\"$${MINIO_BUCKET}\";
      mc anonymous set download decalove/\"$${MINIO_BUCKET}\";
      echo 'MinIO bucket ready';
      "
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DEBUG: ${DEBUG:-False}
      DB_USER: ${DB_USER:-interview_user}
      DB_PASSWORD: ${DB_PASSWORD:-interview_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-interview_db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-90}
      OPENROUTER_CONNECT_TIMEOUT: ${OPENROUTER_CONNECT_TIMEOUT:-10}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-3}
      QUESTION_GENERATION_TIMEOUT: ${QUESTION_GENERATION_TIMEOUT:-240}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-decalove-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-interview}
      MINIO_SECURE: "False"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:4530}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - decalove
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  decalove:
    external: true
    name: ${DECALOVE_NETWORK:-decalove_default}
